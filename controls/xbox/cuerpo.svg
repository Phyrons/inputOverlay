<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <style>
      .cls-body {
        fill: #E3E3E3;
		stroke: url(#gradienteCuerpo);
		stroke-width: 15px;
      }
    </style>
	<linearGradient id="gradienteCuerpo" x1="552.925" y1="455" x2="651.075" y2="285" gradientUnits="userSpaceOnUse">
      <stop data-diseño="cuerpoGradiente1" data-diseño-tipo="stop-color" offset="0.375" stop-color="#A3A3A3"/>
      <stop data-diseño="cuerpoGradiente2" data-diseño-tipo="stop-color" offset="0.625" stop-color="#EBEBEB"/>
    </linearGradient>
    <clipPath id="recorteCuerpo">
      <rect x="20" y="30" width="860" height="460" rx="100" ry="100"/>
    </clipPath>
  </defs>
  <g id="capa-cuerpo">
  <rect id="cuerpo" class="cls-body" data-diseño="cuerpo" data-diseño-tipo="fill" x="20" y="30" width="860" height="460" rx="100" ry="100"/>
  <g clip-path="url(#recorteCuerpo)">
    <polygon points="0,-100 130,-100 580,620 450,620"
             data-diseño="brilloCuerpo" data-diseño-tipo="fill"
             data-diseño-opacidad="brilloCuerpoOpacidad"
             fill="#FFFFFF" opacity="0.2">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="1000 -520; 1000 -520; -650 520"
                        keyTimes="0; 0.857; 1"
                        dur="14s"
                        repeatCount="indefinite"/>
    </polygon>
  </g>
  <image href="controls\xbox\imagenes\xboxLogo.webp" width="600" height="400"
       transform="translate(305,-10) scale(0.5)"
       preserveAspectRatio="xMidYMid meet"/>
	   
	<image href="controls\xbox\imagenes\esfera.gif" width="600" height="400"
       transform="translate(300,160) scale(0.50)"
       preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
 
   <!-- 
		CALCULAR transform="translate(???,???) para CENTRAR IMAGEN
		
		Primero calculamos el centro del marco
		<rect id="cuerpo" class="cls-body" x="20" y="30" width="860" height="460" rx="100" ry="100"/>
		
		El origen del rectángulo está en la esquina superior izquierda: (20,30).
		El centro del rectángulo se calcula como:
		
			centroX = x + (width/2) = 20 + (860/2) = 450
			centroY = y + (height/2) = 30 + (460/2) = 260
			
		Cuando aplicas transform="scale(0.5)", la imagen se reduce al 50%
		pero respecto al origen (0,0), no respecto al centro del rectángulo.
		Para que quede centrada, debes calcular la posición inicial (x,y)
		usando el tamaño final de la imagen (es decir, width × scale y height × scale).
		
		<image href="controls\xbox\PhyronsLogo.PNG" width="600" height="400"
       transform="translate(???,???) scale(0.5)"
       preserveAspectRatio="xMidYMid meet"/>
	   
			En este ejemplo la imagen mide 600×400 y usas scale(0.5):
			
			Ancho escalado = 600 × 0.5 = 300
			Alto escalado = 400 × 0.5 = 200
			
			ImagenCentroX = centroX - (Ancho escalado/2) = 450 - (300/2) = 300
			ImagenCentroY = centroY - (Alto escalado/2) = 260 - (200/2) = 160
			
		<image href="controls\xbox\PhyronsLogo.PNG" width="600" height="400"
       transform="translate(300,160) scale(0.5)"
       preserveAspectRatio="xMidYMid meet"/>
	-->
