<svg id="RStick" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <style>
      .cls-1, .cls-5 {
        fill: none;
        stroke-width: 15px;
      }

      .cls-1, .cls-4, .cls-5 {
        stroke-linejoin: round;
      }

      .cls-1 {
        stroke: url(#gradienteStickR);
      }

      .cls-2 {
        fill: #E3E3E3;
      }

      .cls-3 {
        fill: #191919;
      }

      .cls-4 {
        fill: #3a3a3a;
        stroke: #000;
        stroke-width: 5px;
      }

      .cls-5 {
        stroke: url(#gradienteStickL);
      }
    </style>
    <linearGradient id="gradienteStickR" x1="552.925" y1="455" x2="651.075" y2="285" gradientUnits="userSpaceOnUse">
      <stop data-diseño="stickGradiente1" data-diseño-tipo="stop-color" offset="0.375" stop-color="#A3A3A3"/>
      <stop data-diseño="stickGradiente2" data-diseño-tipo="stop-color" offset="0.625" stop-color="#EBEBEB"/>
    </linearGradient>
    <linearGradient id="gradienteStickL" x1="253.925" y1="455" x2="352.075" y2="285" gradientUnits="userSpaceOnUse">
    <stop data-diseño="stickGradiente1" data-diseño-tipo="stop-color" offset="0.375" stop-color="#A3A3A3"/>
    <stop data-diseño="stickGradiente2" data-diseño-tipo="stop-color" offset="0.625" stop-color="#EBEBEB"/>
	</linearGradient>
  </defs>
  <g id="capa-sticks">
  <circle id="stickRShadow" class="cls-1" cx="602" cy="370" r="85"/>
  <circle id="stickRArea" class="cls-2" data-diseño="stickArea" cx="602" cy="370" r="80"/>
  <circle id="stickRBase" class="cls-3" cx="602" cy="370" r="55"/>
  <circle id="stickR" class="cls-4" data-diseño="stick" cx="602" cy="370" r="40"/>
  <circle id="stickLShadow" class="cls-5" cx="303" cy="370" r="85"/>
  <circle id="stickLArea" class="cls-2" data-diseño="stickArea" cx="303" cy="370" r="80"/>
  <circle id="stickLBase" class="cls-3" cx="303" cy="370" r="55"/>
  <circle id="stickL" class="cls-4" data-diseño="stick" cx="303" cy="370" r="40"/>
  </g>
</svg>
